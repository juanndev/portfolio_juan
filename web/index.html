  <body style="background-color: #070709; margin: 0;">

    <div id="loading-container" style="display: flex; justify-content: center; align-items: center; height: 100vh; width: 100vw; position: fixed; top: 0; left: 0; z-index: 9999; background-color: #070709;">
      <style>
        .loader {
          width: 48px;
          height: 48px;
          border: 5px solid #04aebf;
          border-bottom-color: #01f0ff;
          border-radius: 50%;
          display: inline-block;
          box-sizing: border-box;
          animation: rotation 1s linear infinite;
        }
        @keyframes rotation {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
      </style>
      <span class="loader"></span>
    </div>

    <script>
      window.addEventListener('flutter-first-frame', function() {
        var loading = document.getElementById('loading-container');
        if (loading) {
          loading.style.transition = 'opacity 0.4s ease-out';
          loading.style.opacity = '0';
          setTimeout(function() {
            loading.remove();
          }, 400);
        }
      });
    </script>
    <script src="flutter_bootstrap.js" async></script>
  </body>
